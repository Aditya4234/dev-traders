global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "riya-touch-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]
        labels:
          app: riya-touch
          env: production

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
