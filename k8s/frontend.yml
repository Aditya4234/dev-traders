apiVersion: apps/v1
kind: Deployment
metadata:
  name: riya-frontend
  namespace: riya-touch
  labels:
    app: riya-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: riya-frontend
  template:
    metadata:
      labels:
        app: riya-frontend
    spec:
      containers:
        - name: frontend
          image: riya-touch/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://riya-backend:5000/api"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: riya-frontend
  namespace: riya-touch
  labels:
    app: riya-frontend
spec:
  selector:
    app: riya-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: riya-frontend-hpa
  namespace: riya-touch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: riya-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
