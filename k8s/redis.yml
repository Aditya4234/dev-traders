apiVersion: apps/v1
kind: Deployment
metadata:
  name: riya-redis
  namespace: riya-touch
  labels:
    app: riya-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riya-redis
  template:
    metadata:
      labels:
        app: riya-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: riya-redis
  namespace: riya-touch
  labels:
    app: riya-redis
spec:
  selector:
    app: riya-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
