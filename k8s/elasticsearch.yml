apiVersion: apps/v1
kind: Deployment
metadata:
  name: riya-elasticsearch
  namespace: riya-touch
  labels:
    app: riya-elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riya-elasticsearch
  template:
    metadata:
      labels:
        app: riya-elasticsearch
    spec:
      initContainers:
        - name: increase-vm-max-map
          image: busybox
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: es-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: riya-elasticsearch
  namespace: riya-touch
  labels:
    app: riya-elasticsearch
spec:
  selector:
    app: riya-elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP
