apiVersion: apps/v1
kind: Deployment
metadata:
  name: riya-backend
  namespace: riya-touch
  labels:
    app: riya-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: riya-backend
  template:
    metadata:
      labels:
        app: riya-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: riya-touch/backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: riya-touch-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: riya-backend
  namespace: riya-touch
  labels:
    app: riya-backend
spec:
  selector:
    app: riya-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: riya-backend-hpa
  namespace: riya-touch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: riya-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
