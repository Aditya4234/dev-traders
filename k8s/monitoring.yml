apiVersion: v1
kind: Service
metadata:
  name: riya-prometheus
  namespace: riya-touch
  labels:
    app: riya-prometheus
spec:
  selector:
    app: riya-prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riya-prometheus
  namespace: riya-touch
  labels:
    app: riya-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riya-prometheus
  template:
    metadata:
      labels:
        app: riya-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: prometheus-config
          configMap:
            name: riya-prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: riya-prometheus-config
  namespace: riya-touch
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: "riya-backend"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: riya-backend
            action: keep
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
