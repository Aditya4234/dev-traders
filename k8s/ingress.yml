apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: riya-touch-ingress
  namespace: riya-touch
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - riyatouch.com
        - www.riyatouch.com
      secretName: riya-touch-tls
  rules:
    - host: riyatouch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: riya-frontend
                port:
                  number: 3000
    - host: www.riyatouch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: riya-frontend
                port:
                  number: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: riya-nginx-lb
  namespace: riya-touch
spec:
  type: LoadBalancer
  selector:
    app: riya-nginx
  ports:
    - port: 80
      targetPort: 80
    - port: 443
      targetPort: 443
